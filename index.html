
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milk Game Hub</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0d12;
  color: #f4f4f8;
  font-family: system-ui, sans-serif;
}

header {
  padding: 22px;
  background: #151923;
  border-bottom: 1px solid #303747;
  font-size: 23px;
  font-weight: 800;
}

header span { color: #a78bfa; }

main {
  max-width: 1000px;
  margin: auto;
  padding: 24px 16px;
}

h1 { font-size: 32px; margin-bottom: 8px; }
p { color: #a1a6b5; }

button, .play {
  display: inline-block;
  padding: 12px 15px;
  border: 0;
  border-radius: 9px;
  background: #a78bfa;
  color: #171222;
  font-weight: bold;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}

.search {
  display: flex;
  gap: 8px;
  margin: 24px 0;
}

input {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #303747;
  background: #151923;
  color: white;
  font-size: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 14px;
}

.card, .category {
  background: #151923;
  border: 1px solid #303747;
  border-radius: 13px;
  overflow: hidden;
}

.art {
  padding: 24px 8px;
  text-align: center;
  font-size: 42px;
  background: linear-gradient(135deg,#292044,#182b42);
}

.details { padding: 13px; }
.details h3 { margin: 0 0 6px; }
.details p { font-size: 13px; }

.details .play {
  width: 100%;
  text-align: center;
}

.category {
  padding: 22px 14px;
  color: white;
  text-align: center;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
}

.category:active { transform: scale(0.98); }

.category .emoji {
  display: block;
  font-size: 38px;
  margin-bottom: 8px;
}

.back {
  background: #202532;
  color: white;
  margin-bottom: 16px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #a1a6b5;
}

[hidden] { display: none !important; }
</style>
</head>

<body>
<header>🥛 Milk <span>Game Hub</span></header>

<main>
  <section id="home">
    <h1>Find your next game.</h1>
    <p>Choose a category and find something fun!</p>

    <div class="grid">
      <button class="category" data-category="Horror">
        <span class="emoji">👻</span>
        Horror Games
        <p>Survive the night...</p>
      </button>

      <button class="category" data-category="Arcade">
        <span class="emoji">🎮</span>
        Arcade Games
        <p>Quick fun.</p>
      </button>

      <button class="category" data-category="Puzzle">
        <span class="emoji">🧩</span>
        Puzzle Games
        <p>Use your brain.</p>
      </button>

      <button class="category" data-category="Action">
        <span class="emoji">⚡</span>
        Action Games
        <p>Coming soon.</p>
      </button>
    </div>
  </section>

  <section id="categoryPage" hidden>
    <button class="back" id="back">← Back to categories</button>
    <h1 id="categoryTitle">Horror Games</h1>
    <p id="categoryDescription">Pick your game.</p>

    <div class="search">
      <input id="search" placeholder="Search games..."
        aria-label="Search games">
      <button id="searchBtn">Search</button>
    </div>

    <section class="grid" id="games"></section>
    <p id="empty" hidden>No games found.</p>
  </section>
</main>

<footer>Milk Game Hub · Made for fun 🥛</footer>

<script>
const games = [
  {
    name: "Five Nights at Freddy's",
    cat: "Horror",
    icon: "🐻",
    url: "https://fnaf.co/"
  },
  {
    name: "Five Nights at Freddy's 2",
    cat: "Horror",
    icon: "🎭",
    url: "https://fnaf.co/five-nights-at-freddys-2"
  },
  {
    name: "Five Nights at Freddy's 3",
    cat: "Horror",
    icon: "🐰",
    url: "https://fnaf.co/five-nights-at-freddys-3"
  },
  {
    name: "Five Nights at Freddy's 4",
    cat: "Horror",
    icon: "🌙",
    url: "https://fnaf.co/fnaf-4"
  }
];

const home = document.getElementById("home");
const categoryPage = document.getElementById("categoryPage");
const categoryTitle = document.getElementById("categoryTitle");
const categoryDescription =
  document.getElementById("categoryDescription");
const grid = document.getElementById("games");
const search = document.getElementById("search");

let currentCategory = "Horror";

document.querySelectorAll("[data-category]").forEach(button => {
  button.addEventListener("click", () => {
    currentCategory = button.dataset.category;
    home.hidden = true;
    categoryPage.hidden = false;

    categoryTitle.textContent = currentCategory + " Games";
    categoryDescription.textContent =
      currentCategory === "Horror"
        ? "Survive the night. Choose your game!"
        : "More games coming soon!";

    search.value = "";
    render();
    window.scrollTo(0, 0);
  });
});

document.getElementById("back").addEventListener("click", () => {
  categoryPage.hidden = true;
  home.hidden = false;
  window.scrollTo(0, 0);
});

function render() {
  const query = search.value.toLowerCase().trim();

  const results = games.filter(game =>
    game.cat === currentCategory &&
    game.name.toLowerCase().includes(query)
  );

  grid.replaceChildren();
  document.getElementById("empty").hidden =
    results.length !== 0;

  results.forEach(game => {
    const card = document.createElement("article");
    card.className = "card";

    const art = document.createElement("div");
    art.className = "art";
    art.textContent = game.icon;

    const details = document.createElement("div");
    details.className = "details";

    const title = document.createElement("h3");
    title.textContent = game.name;

    const category = document.createElement("p");
    category.textContent = game.cat;

    const play = document.createElement("a");
    play.className = "play";
    play.textContent = "Play Game 🎮";
    play.href = game.url;
    play.target = "_blank";
    play.rel = "noopener noreferrer";

    details.append(title, category, play);
    card.append(art, details);
    grid.appendChild(card);
  });
}

document.getElementById("searchBtn")
  .addEventListener("click", render);

search.addEventListener("input", render);

search.addEventListener("keydown", event => {
  if (event.key === "Enter") render();
});
</script>
</body>
</html>
